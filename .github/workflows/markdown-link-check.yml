name: markdown-link-check
on:
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".github/mlc-config.json"
