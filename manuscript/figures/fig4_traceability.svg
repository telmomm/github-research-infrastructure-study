<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <style>
    .hdr{font-weight:700;font-size:15px;fill:#111827}
    .note{font-size:10.5px;fill:#6b7280}
    .n{fill:#eef2f7;stroke:#8fa6bd;stroke-width:1.2}
    .t{font-size:11px;fill:#1f2a37;font-weight:600}
    .s{font-size:9.5px;fill:#5b6b82}
    .lnk{stroke:#3b6fb0;stroke-width:2;marker-end:url(#h)}
    .mech{font-size:9.5px;fill:#3b6fb0;font-style:italic}
  </style>
  <defs>
    <marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b6fb0"/>
    </marker>
  </defs>

  <text x="24" y="30" class="hdr">End-to-end traceability path</text>
  <text x="24" y="48" class="note">Any node is reachable from any other via recorded cross-references — the operational meaning of RM10.</text>

  <!-- row 1 -->
  <g>
    <rect x="30"  y="70" width="150" height="46" rx="6" class="n"/><text x="105" y="90" text-anchor="middle" class="t">RQ issue</text><text x="105" y="105" text-anchor="middle" class="s">A3 · "RQ-n: …"</text>
    <rect x="250" y="70" width="150" height="46" rx="6" class="n"/><text x="325" y="90" text-anchor="middle" class="t">Method issue</text><text x="325" y="105" text-anchor="middle" class="s">A2 · in milestone</text>
    <rect x="470" y="70" width="150" height="46" rx="6" class="n"/><text x="545" y="90" text-anchor="middle" class="t">Branch + commits</text><text x="545" y="105" text-anchor="middle" class="s">B4</text>
    <rect x="690" y="70" width="180" height="46" rx="6" class="n"/><text x="780" y="90" text-anchor="middle" class="t">Analysis PR</text><text x="780" y="105" text-anchor="middle" class="s">C2 · CI run (C3)</text>
  </g>
  <line x1="180" y1="93" x2="248" y2="93" class="lnk"/><text x="214" y="86" text-anchor="middle" class="mech">Refs #</text>
  <line x1="400" y1="93" x2="468" y2="93" class="lnk"/><text x="434" y="86" text-anchor="middle" class="mech">refs #</text>
  <line x1="620" y1="93" x2="688" y2="93" class="lnk"/><text x="654" y="86" text-anchor="middle" class="mech">Closes #</text>

  <!-- connector down -->
  <path d="M780,116 v40 h-750 v20" fill="none" class="lnk"/>

  <!-- row 2 -->
  <g>
    <rect x="30"  y="196" width="150" height="46" rx="6" class="n"/><text x="105" y="216" text-anchor="middle" class="t">Result artifact</text><text x="105" y="231" text-anchor="middle" class="s">C1</text>
    <rect x="250" y="196" width="150" height="46" rx="6" class="n"/><text x="325" y="216" text-anchor="middle" class="t">Manuscript PR</text><text x="325" y="231" text-anchor="middle" class="s">C2</text>
    <rect x="470" y="196" width="150" height="46" rx="6" class="n"/><text x="545" y="216" text-anchor="middle" class="t">Release vX.Y</text><text x="545" y="231" text-anchor="middle" class="s">D1 · auto notes</text>
    <rect x="690" y="196" width="180" height="46" rx="6" class="n"/><text x="780" y="216" text-anchor="middle" class="t">Zenodo DOI</text><text x="780" y="231" text-anchor="middle" class="s">D2 · external</text>
  </g>
  <line x1="180" y1="219" x2="248" y2="219" class="lnk"/><text x="214" y="212" text-anchor="middle" class="mech">Refs #</text>
  <line x1="400" y1="219" x2="468" y2="219" class="lnk"/><text x="434" y="212" text-anchor="middle" class="mech">Closes #</text>
  <line x1="620" y1="219" x2="688" y2="219" class="lnk"/><text x="654" y="212" text-anchor="middle" class="mech">tag → notes</text>

  <rect x="30" y="300" width="840" height="130" rx="8" fill="#f6f8fb" stroke="#d6dee8"/>
  <text x="48" y="324" class="t">Connective mechanism (B3 Linkage Discipline)</text>
  <text x="48" y="348" class="s">every commit names its issue  ·  every PR uses "Closes #"  ·  every issue names its RQ and milestone</text>
  <text x="48" y="368" class="s">the issue / PR timeline records each reference  ·  autogenerated release notes inherit the PR → issue chain</text>
  <text x="48" y="396" class="s">Manual and only as complete as contributors' referencing discipline; no lineage query; stops at data/computation</text>
  <text x="48" y="414" class="s">without deliberate upstream linking (RM2, RM5).</text>
</svg>
